name: CI Pipeline (Quality Check)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm install --legacy-peer-deps
      - name: Lint Shared
        working-directory: ./packages/shared
        run: npm run lint
      - name: Lint API
        working-directory: ./apps/api
        run: npm run lint
      - name: Lint Web
        working-directory: ./apps/web
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm install --legacy-peer-deps
      - name: Typecheck Shared
        working-directory: ./packages/shared
        run: npm run typecheck
      - name: Typecheck API
        working-directory: ./apps/api
        run: npm run typecheck
      - name: Typecheck Web
        working-directory: ./apps/web
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm install --legacy-peer-deps
      - name: Test API
        working-directory: ./apps/api
        run: npm run test -- --coverage
      - name: Test Web
        working-directory: ./apps/web
        run: npm run test -- --coverage

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm install --legacy-peer-deps
      - name: Build Shared
        working-directory: ./packages/shared
        run: npm run build
      - name: Build API
        working-directory: ./apps/api
        run: npm run build
      - name: Build Web
        working-directory: ./apps/web
        run: npm run build
